  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .header {
      font: 600 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      color: #C084FC;
      margin: 0;
      padding-top: 22px;
      letter-spacing: 0.5px;
    }
    .ct-label {
      fill: #C084FC;
      font-size: 11px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    .ct-grid {
      stroke: #C084FC;
      stroke-width: 1px;
      stroke-opacity: 0.15;
      stroke-dasharray: 3px;
    }
    .ct-line {
      fill: none;
      stroke: #7C3AED;
      stroke-width: 3.5px;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 5000;
      stroke-dashoffset: 5000;
      animation: dash 3s ease-in-out forwards;
    }
    .ct-point {
      fill: #EDE9FE;
      stroke: #7C3AED;
      stroke-width: 2px;
      transition: r 0.2s ease;
      animation: blink 1s ease-in-out forwards;
    }
    .ct-area {
      fill: #A855F7;
      fill-opacity: 0.18;
      stroke: none;
    }
    .axis-title {
      fill: #A855F7;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    @keyframes blink {
      from {
        opacity: 0;
        transform: scale(0.5);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    @keyframes dash {
      to {
        stroke-dashoffset: 0;
      }
    }
  </style>

